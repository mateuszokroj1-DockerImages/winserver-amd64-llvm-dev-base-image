# This is a basic workflow to help you get started with Actions

name: Windows Server - deployment to Docker Hub

env:
  tag: mateuszokroj1/winserver-amd64-llvm-dev-base:latest

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main", "releases/*" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: windows-2025

    environment:
      name: production

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Git checkout
        uses: actions/checkout@v6.1.0

      - name: Reclaim disk space and move Docker storage
        run: |
          $visualStudioRoot = 'C:\Program Files\Microsoft Visual Studio'
          if (Test-Path -LiteralPath $visualStudioRoot) {
            Get-ChildItem -LiteralPath $visualStudioRoot -Directory | ForEach-Object {
              foreach ($edition in @('Enterprise', 'Professional', 'Community', 'BuildTools')) {
                $installation = Join-Path $_.FullName $edition
                if (Test-Path -LiteralPath $installation) {
                  Write-Host "Removing unused host Visual Studio installation: $installation"
                  Remove-Item -LiteralPath $installation -Recurse -Force
                }
              }
            }
          }

          foreach ($cache in @(
            "$env:LOCALAPPDATA\Temp",
            "$env:LOCALAPPDATA\NuGet\v3-cache",
            "$env:LOCALAPPDATA\pip\Cache",
            "$env:APPDATA\npm-cache",
            'C:\ProgramData\chocolatey\cache'
          )) {
            if (Test-Path -LiteralPath $cache) {
              Remove-Item -LiteralPath $cache -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          $dockerDataRoot = 'D:\docker'
          New-Item -ItemType Directory -Force -Path $dockerDataRoot | Out-Null
          $dockerConfigDir = 'C:\ProgramData\docker\config'
          New-Item -ItemType Directory -Force -Path $dockerConfigDir | Out-Null
          $dockerConfigPath = Join-Path $dockerConfigDir 'daemon.json'
          $dockerConfig = @{}
          if (Test-Path -LiteralPath $dockerConfigPath) {
            $parsedConfig = Get-Content -LiteralPath $dockerConfigPath -Raw | ConvertFrom-Json
            foreach ($property in $parsedConfig.PSObject.Properties) {
              $dockerConfig[$property.Name] = $property.Value
            }
          }
          $dockerConfig['data-root'] = $dockerDataRoot
          $dockerConfig | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $dockerConfigPath -Encoding utf8
          Restart-Service -Name docker -Force
          $deadline = (Get-Date).AddSeconds(60)
          do {
            Start-Sleep -Seconds 2
            docker info *> $null
          } while ($LASTEXITCODE -ne 0 -and (Get-Date) -lt $deadline)
          if ($LASTEXITCODE -ne 0) { throw 'Docker Engine did not restart with the D: data root' }

          foreach ($driveName in @('C', 'D')) {
            $freeSpace = (Get-PSDrive -Name $driveName).Free
            Write-Host ('Available {0}: space after cleanup: {1:N1} GiB' -f $driveName, ($freeSpace / 1GB))
          }
        shell: powershell
      
      - name: Ensure Docker Engine is running
        run: |
          $service = Get-Service -Name docker -ErrorAction Stop
          if ($service.Status -ne 'Running') {
            Start-Service -Name docker
          }

          $deadline = (Get-Date).AddSeconds(60)
          do {
            $dockerInfo = docker info 2>&1
            if ($LASTEXITCODE -eq 0) {
              docker version
              if ($LASTEXITCODE -ne 0) { throw 'Docker version check failed' }
              Write-Host 'Docker Engine is ready.'
              exit 0
            }
            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $deadline)

          Write-Error ($dockerInfo -join [Environment]::NewLine)
          throw 'Docker Engine did not become ready within 60 seconds.'
        shell: powershell

      - name: Docker Login
        # You may pin to the exact commit or the version.
        # uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        uses: docker/login-action@v4.8.0
        with:
            # Username used to log against the Docker registry
            username: ${{ secrets.DOCKER_LOGIN }}
            # Password or personal access token used to log against the Docker registry
            password: ${{ secrets.DOCKER_PASS }}

      - name: Docker build
        run: docker build --pull --tag ${{ env.tag }} .

      - name: Free Docker build cache before Scout
        run: |
          docker builder prune --all --force
          docker system prune --volumes --force
          foreach ($driveName in @('C', 'D')) {
            $freeSpace = (Get-PSDrive -Name $driveName).Free
            Write-Host ('Available {0}: space before Scout: {1:N1} GiB' -f $driveName, ($freeSpace / 1GB))
          }
        shell: powershell

      - name: Docker push
        run: docker push ${{ env.tag }}
